services:
  web:
    build: .
    container_name: ssu138-web
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - static_vol:/app/staticfiles
      - media_vol:/app/media
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # HTTPS router
      - "traefik.http.routers.ssu138.rule=Host(`ssu-138.ru`) || Host(`www.ssu-138.ru`)"
      - "traefik.http.routers.ssu138.entrypoints=websecure"
      - "traefik.http.routers.ssu138.tls=true"
      - "traefik.http.routers.ssu138.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ssu138.tls.domains[0].main=ssu-138.ru"
      - "traefik.http.routers.ssu138.tls.domains[0].sans=www.ssu-138.ru"
      - "traefik.http.services.ssu138.loadbalancer.server.port=8000"
      # www → apex redirect
      - "traefik.http.routers.ssu138-www.rule=Host(`www.ssu-138.ru`)"
      - "traefik.http.routers.ssu138-www.entrypoints=websecure"
      - "traefik.http.routers.ssu138-www.tls=true"
      - "traefik.http.routers.ssu138-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ssu138-www.middlewares=ssu138-www-redirect"
      - "traefik.http.middlewares.ssu138-www-redirect.redirectregex.regex=^https://www\\.ssu-138\\.ru/(.*)"
      - "traefik.http.middlewares.ssu138-www-redirect.redirectregex.replacement=https://ssu-138.ru/$${1}"
      - "traefik.http.middlewares.ssu138-www-redirect.redirectregex.permanent=true"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.ssu138-http.rule=Host(`ssu-138.ru`) || Host(`www.ssu-138.ru`)"
      - "traefik.http.routers.ssu138-http.entrypoints=web"
      - "traefik.http.routers.ssu138-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

  memcached:
    image: memcached:1.6-alpine
    container_name: ssu138-memcached
    restart: unless-stopped
    networks:
      - internal

  db:
    image: postgres:16-alpine
    container_name: ssu138-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  static_vol:
  media_vol:

networks:
  web:
    external: true
  internal:
    driver: bridge
